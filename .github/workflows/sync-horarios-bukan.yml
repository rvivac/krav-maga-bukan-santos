name: Sync Horários — Bukan Oficial
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'URL da página Bukan Santos para extrair (sobrescreve padrão)'
        required: false
        default: 'https://kravmaga-bukan.com/br/onde-treinar/bukan-santos'
        type: string
      dry_run:
        description: 'Rodar como dry-run (não gravar nem commit)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sync-horarios-bukan
  cancel-in-progress: false

jobs:
  sync-horarios:
    name: Raspagem + validação + commit
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: ./scripts
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Instalar dependências scripts
        run: |
          cd "$GITHUB_WORKSPACE/scripts"
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --no-audit --no-fund
          fi
          npm install --no-audit --no-fund

      - name: Rodar sync horários
        id: sync
        env:
          URL_OVERRIDE: ${{ inputs.url }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          cd "$GITHUB_WORKSPACE"
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$URL_OVERRIDE" ]; then ARGS="$ARGS --url $URL_OVERRIDE"; fi
          node scripts/sync-horarios.mjs $ARGS

      - name: Verificar diff e commitar se houve mudança
        if: ${{ inputs.dry_run != true }}
        id: git_commit
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "Bukan Santos Sync Bot"
          git config user.email "sync-bot@kravmagabukansantos.com.br"
          git fetch origin main
          if [ -z "$(git status --porcelain content/site/horarios-turmas.txt)" ]; then
            echo "result=skip" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração para commitar. Conteúdo idêntico."
            exit 0
          fi
          git stash push --include-untracked -- content/site/horarios-turmas.txt .cache/horarios.sha256 2>/dev/null
          git pull --no-rebase --ff-only origin main || git merge --no-edit origin/main || true
          git stash pop 2>/dev/null || true
          TS_BR=$(TZ='America/Sao_Paulo' date '+%Y-%m-%d %H:%M %Z')
          MSG="sync(horarios): atualiza turmas automaticamente — ${TS_BR}"
          git add content/site/horarios-turmas.txt
          if [ -f .cache/horarios.sha256 ]; then git add .cache/horarios.sha256; fi
          git commit -m "$MSG"
          git push --set-upstream --force-with-lease origin main
          echo "result=committed" >> "$GITHUB_OUTPUT"

      - name: Resumo de saída
        if: always()
        run: |
          echo "✅ Etapa sync finalizada. Status: ${{ steps.sync.outcome }} | Git: ${{ steps.git_commit.outputs.result || 'n/a' }}"
